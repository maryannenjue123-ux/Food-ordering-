<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pastry Home | Freshly Baked</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- DESIGN TOKENS & PALETTE --- */
        :root {
            --primary: #d4a373;      /* Crust/Bread Color */
            --primary-dark: #a97142;
            --accent: #e5989b;       /* Berry/Pink Color */
            --bg-color: #fff9f5;     /* Warm White */
            --card-bg: beige;
            --text-dark: #4a403a;    /* Dark Coffee */
            --text-light: #0b0505;
            --shadow-soft: 0 10px 40px -10px rgba(0,0,0,0.08);
            --shadow-hover: 0 15px 45px -10px rgba(212, 163, 115, 0.25);
            --radius: 12px;
        }

        /* --- RESET & BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            color: var(--text-dark);
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }
        img { width: 100%; display: block; object-fit: cover; }
        button { cursor: pointer; font-family: inherit; border: none; outline: none; transition: 0.3s; }

        /* --- LAYOUT --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hidden { display: none !important; }

        /* --- NAVIGATION --- */
        header {
            background: #fffaf0; /* Slightly lighter than body for contrast */
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.03);
            padding: 1rem 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* PERSONALIZED LOGO STYLE */
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 12px; /* Space between image and text */
            cursor: pointer;
        }
        
        /* This styles the image inside the logo container */
        .logo img {
            height: 50px;        /* Fixed height for the logo */
            width: auto;         /* Maintain aspect ratio */
            object-fit: contain;   /* Ensure the image fits inside the box without cropping */
            border-radius: 8px;   /* Optional: rounded corners on the logo */
        }

        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { font-weight: 500; font-size: 0.95rem; letter-spacing: 0.5px; color: var(--text-dark); }
        .nav-links a:hover { color: var(--accent); }

        .btn-cart {
            position: relative;
            background: var(--text-dark);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .cart-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            margin-bottom: 4rem;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Ensure you have this image file, or replace with a URL */
            background: url("Pastry delights.jpg") no-repeat center/cover;
            filter: brightness(0.6);
            z-index: -1;
        }

        .hero-content {
            max-width: 700px;
            padding: 20px;
            animation: fadeIn 1s ease-out;
        }

        .hero h1 { font-size: 3.5rem; margin-bottom: 1rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .hero p { font-size: 1.2rem; margin-bottom: 2rem; font-weight: 300; }

        .btn {
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 5px 15px rgba(212, 163, 115, 0.4);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* --- MENU / LISTING PAGE --- */
        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .section-header h2 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .section-header p { color: var(--text-light); font-style: italic; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding-bottom: 5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
        }

        .card:hover { transform: translateY(-8px); box-shadow: var(--shadow-hover); }

        .card-img-wrap {
            height: 220px;
            overflow: hidden;
            position: relative;
        }

        .card-img-wrap img { transition: 0.5s; height: 100%; }
        .card:hover .card-img-wrap img { transform: scale(1.05); }

        .card-body { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.3rem; margin-bottom: 0.5rem; }
        .card-desc { font-size: 0.9rem; color: var(--text-light); margin-bottom: 1rem; flex-grow: 1; }
        
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }

        .price { font-size: 1.2rem; font-weight: 700; color: var(--primary-dark); }
        
        .btn-sm {
            padding: 8px 20px;
            font-size: 0.75rem;
            border: 1px solid var(--primary);
            color: var(--primary);
            background: transparent;
            border-radius: 20px;
        }
        .btn-sm:hover { background: var(--primary); color: white; }

        /* --- AUTH FORMS --- */
        .auth-wrapper {
            display: flex;
            justify-content: center;
            padding: 4rem 0;
        }
        
        .auth-box {
            background: white;
            padding: 3rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-box h2 { margin-bottom: 1.5rem; }
        
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 700; }
        
        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-family: inherit;
            background: #fafafa;
            transition: 0.3s;
        }
        .form-input:focus { border-color: var(--primary); background: white; outline: none; }

        .form-switch { margin-top: 1.5rem; font-size: 0.9rem; }
        .form-switch span { color: var(--accent); font-weight: bold; cursor: pointer; }

        /* --- CART --- */
        .cart-wrapper {
            max-width: 800px;
            margin: 0 auto 4rem auto;
            background: white;
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px dashed #eee;
        }
        .cart-item:last-child { border-bottom: none; }

        .cart-thumb {
            width: 80px; height: 80px; border-radius: 8px; object-fit: cover; margin-right: 20px;
        }

        .cart-details { flex-grow: 1; }
        .cart-details h4 { margin-bottom: 5px; }
        
        .cart-actions { text-align: right; }
        .remove-btn { color: #ff6b6b; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }

        .total-section {
            margin-top: 2rem;
            text-align: right;
            font-size: 1.5rem;
            font-family: 'Playfair Display', serif;
        }

        /* --- TOAST --- */
        #toast-box {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
        }
        .toast {
            background: white;
            color: var(--text-dark);
            padding: 15px 25px;
            margin-top: 10px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            border-left: 5px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideUp 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .nav-links { display: none; } /* Simplified for mobile view */
            .cart-wrapper { padding: 1rem; }
            .logo span { display: none; } /* Hide text on small screens if logo is present */
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <!-- PERSONALIZED LOGO SECTION -->
                <!-- Replace 'logo.png' below with your image file name -->
                <div class="logo" onclick="router('home')">
                    <img src="logo.png" alt="The Pastry Home Logo">
                    <span>Coffee Cave Delights</span>
                </div>
                
                <div class="nav-links">
                    <a onclick="router('home')">Home</a>
                    <a onclick="router('menu')">Our Menu</a>
                    <a onclick="router('login')" id="nav-login">Login</a>
                    <button class="btn-cart" onclick="router('cart')">
                        🛒 <span class="cart-badge" id="cart-count">0</span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main id="app-root">
        <!-- Dynamic Content Injected Here -->
    </main>

    <div id="toast-box"></div>

    <script>
        // --- DATA & STATE ---
        const pastries = [
            { id: 1, name: "Classic Croissant", price: 150, desc: "Buttery, flaky, and freshly baked every morning.", img: "French Croissant.jpg" },
            { id: 2, name: "Fruit Tart", price: 450, desc: "Custard filled pastry topped with fresh glazed fruits.", img: "Fruit Tart.jpg" },
            { id: 3, name: "Chocolate Cake", price: 400, desc: "Sponge pastry layered with cream topped with chocolate ganache.", img: "chocolate cake.jpg" },
            { id: 4, name: "Blueberry Muffin", price: 180, desc: "Fluffy muffin bursting with fresh blueberries.", img: "Blueberry Muffins.jpg" },
            { id: 5, name: "Cinnamon Roll", price: 200, desc: "Soft dough rolled with cinnamon sugar and cream cheese frosting.", img: "Cinnamon Rolls.jpg" },
            { id: 6, name: "Black Forest Cake", price: 220, desc: "Layered pastry with strawberry slices and cream.", img: "black forest.jpg" },
            { id: 7, name: "Cookies", price: 100, desc: "Crunchy and comes in other flavours.", img: "Cookies.jpg" },
            { id: 8, name: "Swizz Roll", price: 200, desc: "Rolled pastry with jam and strawberrys slices.", img: "Swiss roll.jpg" },
            { id: 9, name: "Red Velvet Cake", price: 250, desc: "Layered pastry with many flavours.", img: "Red velvet.jpg" },
            { id: 10, name: "Fruit Cake", price: 180, desc: "Layered pastry with fruits infused in it.", img: "Fruit cake.jpg" },
            { id: 11, name: "Apple Pie", price: 150, desc: "Double crust and a filling of spiced apples.", img: "apple pie.jpg" },
            { id: 12, name: "Doughnut", price: 100, desc: "A sweet snack that can be found in different flavours.", img: "donuts.jpg" }
        ];

        let state = {
            user: null,
            cart: []
        };

        // --- ROUTER ---
        function router(view) {
            const app = document.getElementById('app-root');
            updateNav();
            
            if(view === 'home') app.innerHTML = renderHome();
            else if(view === 'menu') app.innerHTML = renderMenu();
            else if(view === 'login') app.innerHTML = renderLogin();
            else if(view === 'register') app.innerHTML = renderRegister();
            else if(view === 'cart') app.innerHTML = renderCart();
            
            window.scrollTo(0,0);
        }

        function updateNav() {
            const link = document.getElementById('nav-login');
            if(state.user) {
                link.textContent = 'Logout';
                link.onclick = logout;
            } else {
                link.textContent = 'Login';
                link.onclick = () => router('login');
            }
        }

        // --- VIEWS ---
        function renderHome() {
            return `
                <section class="hero">
                    <div class="hero-bg"></div>
                    <div class="hero-content">
                        <h1>Artisan Pastries & Coffee</h1>
                        <p>Experience the warmth of freshly baked goods made with love and the finest ingredients.</p>
                        <button class="btn btn-primary" onclick="router('menu')">View Menu</button>
                    </div>
                </section>
                <section class="container">
                    <div class="section-header">
                        <h2>Customer Favorites</h2>
                        <p>Our most loved treats this week</p>
                    </div>
                    <div class="menu-grid">
                        ${pastries.slice(0,3).map(item => createCard(item)).join('')}
                    </div>
                </section>
            `;
        }

        function renderMenu() {
            return `
                <section class="container" style="padding-top: 3rem;">
                    <div class="section-header">
                        <h2>Full Menu</h2>
                        <p>From savory to sweet, we have it all</p>
                    </div>
                    <div class="menu-grid">
                        ${pastries.map(item => createCard(item)).join('')}
                    </div>
                </section>
            `;
        }

        function createCard(item) {
            return `
                <div class="card">
                    <div class="card-img-wrap">
                        <img src="${item.img}" alt="${item.name}">
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${item.name}</h3>
                        <p class="card-desc">${item.desc}</p>
                        <div class="card-footer">
                            <span class="price">Ksh ${item.price}</span>
                            <button class="btn-sm" onclick="addToCart(${item.id})">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLogin() {
            return `
                <div class="auth-wrapper">
                    <div class="auth-box">
                        <h2>Welcome Back</h2>
                        <form onsubmit="handleLogin(event)">
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-input" required placeholder="you@example.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-input" required>
                            </div>
                            <button class="btn btn-primary" style="width:100%">Sign In</button>
                        </form>
                        <div class="form-switch">
                            New here? <span onclick="router('register')">Create an account</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRegister() {
            return `
                <div class="auth-wrapper">
                    <div class="auth-box">
                        <h2>Join Us</h2>
                        <form onsubmit="handleRegister(event)">
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="reg-name" class="form-input" required placeholder="Jane Doe">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" id="reg-email" class="form-input" required placeholder="you@example.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-input" required>
                            </div>
                            <button class="btn btn-primary" style="width:100%">Register</button>
                        </form>
                        <div class="form-switch">
                            Already have an account? <span onclick="router('login')">Login</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCart() {
            if(state.cart.length === 0) return `
                <div class="container" style="text-align:center; padding: 5rem 0;">
                    <h2>Your cart is empty</h2>
                    <p style="margin: 1rem 0 2rem 0; color:var(--text-light)">Time to add some sweetness!</p>
                    <button class="btn btn-primary" onclick="router('menu')">Start Browsing</button>
                </div>`;

            const total = state.cart.reduce((sum, item) => sum + item.price, 0);
            
            return `
                <div class="container" style="padding-top: 3rem;">
                    <div class="section-header">
                        <h2>Your Selection</h2>
                    </div>
                    <div class="cart-wrapper">
                        ${state.cart.map((item, idx) => `
                            <div class="cart-item">
                                <img src="${item.img}" class="cart-thumb">
                                <div class="cart-details">
                                    <h4>${item.name}</h4>
                                    <p style="color:var(--text-light)">Ksh ${item.price}</p>
                                </div>
                                <div class="cart-actions">
                                    <span class="remove-btn" onclick="removeFromCart(${idx})">Remove</span>
                                </div>
                            </div>
                        `).join('')}
                        <div class="total-section">
                            Total: <span style="color:var(--primary-dark)">Ksh ${total}</span>
                        </div>
                        <div style="text-align:right; margin-top:1.5rem;">
                            <button class="btn btn-primary" onclick="checkout()">Place Order</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- LOGIC ---
        function addToCart(id) {
            const item = pastries.find(p => p.id === id);
            state.cart.push(item);
            document.getElementById('cart-count').textContent = state.cart.length;
            showToast(`Added ${item.name} to cart`);
        }

        function removeFromCart(index) {
            state.cart.splice(index, 1);
            document.getElementById('cart-count').textContent = state.cart.length;
            router('cart');
        }

        function handleLogin(e) {
            e.preventDefault();
            // Mock Login
            state.user = { name: "Customer", email: "test@pastry.com" };
            showToast("Welcome back!");
            router('home');
        }

        function handleRegister(e) {
            e.preventDefault();
            // Mock Register
            state.user = { name: document.getElementById('reg-name').value, email: document.getElementById('reg-email').value };
            showToast("Account created successfully!");
            router('home');
        }

        function logout() {
            state.user = null;
            state.cart = [];
            document.getElementById('cart-count').textContent = 0;
            showToast("Logged out.");
            router('home');
        }

        function checkout() {
            if(!state.user) {
                showToast("Please login to checkout.");
                router('login');
                return;
            }
            showToast("Order placed successfully!");
            state.cart = [];
            document.getElementById('cart-count').textContent = 0;
            setTimeout(() => router('home'), 1500);
        }

        function showToast(msg) {
            const box = document.getElementById('toast-box');
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            box.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // Init
        router('home');
    </script>
</body>
</html>
